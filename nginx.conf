worker_processes 1;
pid /run/nginx.pid;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}